services:
  clause:
    build:
      context: .
      network: host
    image: clause:local
    network_mode: host
    container_name: clause
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - .env
    volumes:
      - clause-data:/app/data
      - clause-guilds:/app/guilds

volumes:
  clause-data:
  clause-guilds:
